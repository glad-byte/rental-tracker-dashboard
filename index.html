<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weehawken Rent Watch</title>
<style>
/* Hudson waterfront at dusk: mineral grounds, deep teal ink, a brass note from
   lit windows spent only on the leading row. Series hues are the validated
   categorical slots 1 and 2, which is a separate job from the UI accent. */
:root{
  --bg:#e9edee; --panel:#fdfdfc; --sunk:#eff2f2; --sunk2:#e4eaea;
  --ink:#12292b; --muted:#5d6f70; --faint:#8b9b9c; --line:#d3dadb;
  --accent:#1d6f6a; --accent-soft:#1d6f6a26; --brass:#a8762f;
  --down:#2f6f4f; --up:#a5432c; --warn:#b07a1e;
  --s1:#2a78d6; --s2:#eb6834; --s1-soft:#2a78d633; --s2-soft:#eb683433;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101819; --panel:#162122; --sunk:#1b2627; --sunk2:#212d2e;
  --ink:#dfe7e6; --muted:#849899; --faint:#647a7b; --line:#26383a;
  --accent:#4fb3a8; --accent-soft:#4fb3a82e; --brass:#d29a4d;
  --down:#5aa77c; --up:#e08268; --warn:#d7a949;
  --s1:#3987e5; --s2:#d95926; --s1-soft:#3987e53d; --s2-soft:#d959263d;
}}
:root[data-theme="dark"]{
  --bg:#101819; --panel:#162122; --sunk:#1b2627; --sunk2:#212d2e;
  --ink:#dfe7e6; --muted:#849899; --faint:#647a7b; --line:#26383a;
  --accent:#4fb3a8; --accent-soft:#4fb3a82e; --brass:#d29a4d;
  --down:#5aa77c; --up:#e08268; --warn:#d7a949;
  --s1:#3987e5; --s2:#d95926; --s1-soft:#3987e53d; --s2-soft:#d959263d;
}
*{box-sizing:border-box}
/* The UA rule for [hidden] is display:none, and any author rule beats it --
   .chk{display:inline-flex} left a hidden control on screen doing nothing. */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.wrap{max-width:1280px;margin:0 auto;padding:30px 22px 80px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:-.015em;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;
  color:var(--muted);cursor:pointer}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-top:22px}
.tile{background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:3px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  font-weight:600}
.tile .v{font-size:30px;line-height:1.1;letter-spacing:-.025em}
.tile .n{font-size:13px;color:var(--muted)}
.tile.lead .v{color:var(--brass)}
.tile.hit .v{color:var(--accent)}
.target{margin-top:14px;padding:13px 17px;display:flex;gap:8px 26px;flex-wrap:wrap;
  align-items:baseline;border-left:3px solid var(--accent)}
.target .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  font-weight:700}
.target .r{font-size:13.5px;font-variant-numeric:tabular-nums}
.target .why{font-size:12.5px;color:var(--muted);flex-basis:100%}
tr.row.hit td:first-child{border-left-color:var(--accent);border-left-width:5px}
td.hit{color:var(--accent);font-weight:650}

section{margin-top:34px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:11px;flex-wrap:wrap}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  margin:0;font-weight:700}
.rule{flex:1;height:1px;background:var(--line);min-width:20px}
.hint{font-size:12px;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:11px 14px;
  border-bottom:1px solid var(--line);background:var(--sunk)}
.bar select{padding:4px 8px}

.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;background:var(--sunk);cursor:pointer;user-select:none;position:relative}
th:hover{color:var(--accent)}
th.sorted{color:var(--accent)}
th.l,td.l{text-align:left}
tbody tr.row{cursor:pointer}
tbody tr.row:hover,tbody tr.row.open{background:var(--sunk)}
tbody tr.row td:first-child{border-left:3px solid var(--line);font-weight:650}
tr.row.good td:first-child{border-left-color:var(--accent)}
tr.row.tight td:first-child{border-left-color:var(--warn)}
tr.row.over td:first-child{border-left-color:var(--up)}
tr.row.top td:first-child{border-left-color:var(--brass)}
td.step{color:var(--muted)}
td.cost{font-weight:700;font-size:15px;background:var(--sunk2)}
/* The divider: left of it the property's own numbers, right of it whatever
   move-in date you manage to negotiate. */
td.soft,th[data-k="overlap"]{border-left:1px dashed var(--line)}
td.soft{font-style:italic}
td.total{font-weight:600;color:var(--muted)}
td.eff{font-weight:600}
.credit{color:var(--down)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;
  font-size:11px;color:var(--muted);margin-right:3px;letter-spacing:.03em;
  font-family:ui-monospace,"SF Mono",Menlo,monospace}
.chip.hi{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.detail td{background:var(--sunk);padding:0;border-left:3px solid var(--line)}
.bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px 26px;
  padding:15px 18px}
.bd div{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.bd .lbl{color:var(--muted)}
.bd .off{color:var(--faint);font-size:12px}
.more{width:100%;border:0;border-radius:0;background:var(--sunk);color:var(--accent);
  padding:10px;font-size:13.5px}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px}
.chart{padding:14px 16px 8px}
.chart h3{margin:0 0 2px;font-size:13.5px;font-weight:650}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
  margin:6px 0 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;
  vertical-align:baseline}
.axis{font-size:10.5px;fill:var(--faint)}
.grid{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:9;pointer-events:none;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;
  box-shadow:0 4px 16px #0003;max-width:250px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{font-weight:650}

.ev{display:flex;gap:11px;align-items:baseline;padding:10px 15px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.ev:last-child{border-bottom:0}
.ev .tag{font-weight:650;white-space:nowrap}
.ev .meta{color:var(--muted);font-size:13px}
.ev time{color:var(--faint);font-size:12px;margin-left:auto;white-space:nowrap}
.ev .tag{color:var(--muted)}
.ev.critical{border-left:3px solid var(--brass);background:var(--sunk)}
.ev.critical .tag{color:var(--brass);font-weight:700}
.ev.notable{border-left:3px solid var(--accent)}
.ev.notable .tag{color:var(--accent)}
.ev.routine{border-left:3px solid transparent}
.ev .why{font-size:12.5px;color:var(--muted)}

.spark{display:flex;gap:34px;flex-wrap:wrap;padding:17px 18px}
.spark .s{min-width:200px;display:flex;flex-direction:column;gap:2px}
.spark .p{color:var(--muted);font-size:12.5px}
.spark .n{font-size:27px;letter-spacing:-.025em;line-height:1.15}
svg{display:block}
.limits{margin-top:38px;font-size:12.5px;color:var(--muted);max-width:70ch}
.limits ul{padding-left:17px;margin:7px 0 0}
.limits li{margin:5px 0}
.empty{padding:22px 16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);

/* A sandboxed iframe or a private window has an opaque origin, where reading
   web storage throws outright. Unguarded, that took the whole page down before
   a single row was drawn. Remembering a preference is a nicety; rendering is not. */
const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch { /* no store, no problem */ } },
};
let lang = store.get('rt-lang', "zh");
let mode = store.get('rt-mode', 'cost');
let sortKey = null, sortDir = 1, shownAll = false, shownAllE = false;
let sevAll = store.get('rt-sev', '') === 'all';

const t = (k, p) => { const e = DATA.i18n[k]; if (!e) return k;
  let s = e[lang] || e.zh; if (p) for (const x in p) s = s.replaceAll('{' + x + '}', p[x]);
  return s; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + Number(n).toLocaleString('en-US');
const loc = () => lang === 'zh' ? 'zh-CN' : 'en-US';
const D = iso => new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
const day = iso => D(iso).toLocaleDateString(loc(), {month:'short', day:'numeric'});
const stamp = iso => D(iso).toLocaleString(loc(),
  {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
const PROPS = Object.entries(DATA.properties);
const hue = sid => 'var(--s' + (PROPS.findIndex(([k]) => k === sid) + 1 || 1) + ')';
const RIVER = new Set(['E','ESE','SE']), SOUTH = new Set(['S','SSE','SSW','SW']);

/* ---- tooltip ---- */
const tip = document.getElementById('tip');
function showTip(e, html){ tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 10) + 'px';
  tip.style.top  = Math.min(e.clientY + 14, innerHeight - r.height - 10) + 'px'; }
function hideTip(){ tip.classList.remove('on'); }

/* ---- filters ---- */
const F = {prop:'', beds:'', eProp:'', eKind:''};
function fillSelect(el, opts, all){
  el.innerHTML = '<option value="">' + all + '</option>' +
    opts.map(([v, n]) => '<option value="' + esc(v) + '">' + esc(n) + '</option>').join('');
}
/* The public copy omits the budget caps, so anything keyed off them -- the row
   rail colour, the percentage on the summary tile -- simply does not appear. */
function cap(r){ return (DATA.search.budget || {})[String(r.beds)] || null; }
function keep(r){
  if (F.prop && r.source_id !== F.prop) return false;
  if (F.beds && String(r.beds) !== F.beds) return false;
  return true;
}
const value = r => mode === 'cost' ? r.fixed_cost : r.effective;
function rows(){
  let rs = DATA.ranked.filter(keep);
  const k = sortKey || (mode === 'cost' ? 'fixed_cost' : 'effective');
  rs = rs.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    if (x === y) return 0;
    if (typeof x === 'string' || typeof y === 'string')
      return String(x).localeCompare(String(y)) * sortDir;
    return ((x ?? -Infinity) < (y ?? -Infinity) ? -1 : 1) * sortDir;
  });
  return rs;
}

/* ---- summary ---- */
function renderTiles(){
  const s = DATA.summary;
  const hits = DATA.ranked.filter(r => r.in_target).length;
  const deal = (row, key) => {
    if (!row) return '<div class="tile"><span class="k">' + t(key) + '</span>' +
      '<span class="v serif">' + t('summary.none') + '</span></div>';
    const pct = row.pct_of_budget
      ? '<span class="n">' + t('summary.of_budget', {pct:row.pct_of_budget}) + '</span>' : '';
    return '<div class="tile ' + (row.rank === 1 ? 'lead' : '') + '">' +
      '<span class="k">' + t(key) + '</span>' +
      '<span class="v serif">' + money(row.fixed_cost) + '</span>' +
      '<span class="n">' + esc(row.property) + ' ' + esc(row.unit) + ' · ' +
      row.sqft.toLocaleString('en-US') + ' sqft</span>' + pct + '</div>';
  };
  const countdown = s.deadline
    ? '<div class="tile"><span class="k">' + t('summary.deadline', {date:day(s.deadline)}) +
      '</span><span class="v serif">' + t('summary.days', {n:s.days_left}) + '</span></div>'
    : '';
  document.getElementById('tiles').innerHTML = countdown +
    deal(s.best_2b, 'summary.best_2b') + deal(s.best_1b, 'summary.best_1b') +
    '<div class="tile' + (hits ? ' hit' : '') + '"><span class="k">' +
      t('summary.in_target') + '</span><span class="v serif">' + hits + '</span>' +
      '<span class="n">' + t('summary.candidates') + ' ' + s.candidates + ' · ' +
      t('summary.listed') + ' ' + s.listed + '</span></div>';
}

/* ---- candidates ---- */
const COLS = [
  ['rank','col.rank',0], ['source_id','col.property',1], ['unit','col.unit',1],
  ['plan','col.plan',1], ['beds','col.beds',0], ['sqft','col.sqft',0],
  ['floor','col.floor',0], [null,'col.exposure',1], ['available','col.available',0],
  ['lease_start','col.lease_start',0], ['days_listed','col.days_listed',0],
  ['rent','col.rent',0], [null,'col.fixed',0], ['fixed_cost','col.fixed_cost',0],
  /* everything from here right depends on a move-in date you have to ask for */
  ['overlap','col.overlap',0], ['cost_only','col.total',0], ['applied','col.adjust',0],
  ['effective','col.effective',0],
];
function expoCells(r){
  if (!r.exposure.length) return '<span class="chip">—</span>';
  return r.exposure.map(w => {
    const hi = RIVER.has(w.sector) || SOUTH.has(w.sector);
    const dist = w.obstruction_m === null ? t('exposure.open')
      : t('exposure.blocked', {n:w.obstruction_m});
    return '<span class="chip' + (hi ? ' hi' : '') + '" title="' + esc(dist) + '">' +
      esc(w.sector) + ' ' + esc(dist) + '</span>';
  }).join('');
}
function renderTable(){
  const thead = document.querySelector('#tbl thead'), tbody = document.querySelector('#tbl tbody');
  const active = sortKey || (mode === 'cost' ? 'fixed_cost' : 'effective');
  thead.innerHTML = '<tr>' + COLS.map(([k, label, left]) => {
    const hint = DATA.i18n[label + '_hint']
      ? ' title="' + esc(t(label + '_hint', {end: day(DATA.search.current_lease_end)})) + '"' : '';
    return '<th class="' + (left ? 'l ' : '') + (k === active ? 'sorted' : '') +
      '" data-k="' + (k || '') + '"' + hint + '>' + t(label) +
      (DATA.i18n[label + '_hint'] ? ' ⓘ' : '') +
      (k === active ? (sortDir > 0 ? ' ↑' : ' ↓') : '') + '</th>';
  }).join('') + '</tr>';
  thead.querySelectorAll('th[data-k]:not([data-k=""])').forEach(th =>
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
      renderTable();
    }));

  const all = rows();
  if (!all.length){
    tbody.innerHTML = '<tr><td colspan="' + COLS.length + '" class="empty">' +
      t('meta.no_candidates') + '</td></tr>';
    document.getElementById('more').hidden = true; return;
  }
  const lim = shownAll ? all.length : Math.min(all.length, DATA.page_size);
  tbody.innerHTML = all.slice(0, lim).map(r => {
    const c = cap(r);
    const tier = (r.in_target ? 'hit ' : '') +
      (r.rank === 1 ? 'top' : !c ? ''
       : r.rent / c <= 0.9 ? 'good' : r.rent / c <= 1 ? 'tight' : 'over');
    const fixed = r.fees + r.parking;
    const cells = [
      ['', r.rank], ['l', esc(DATA.properties[r.source_id] || r.source_id)], ['l', esc(r.unit)],
      ['l', esc(r.plan || '—')], ['', r.beds], ['', r.sqft.toLocaleString('en-US')],
      ['', r.floor ?? '—'], ['l', expoCells(r)], ['', day(r.available)], ['', day(r.lease_start)],
      ['step', r.days_listed === null ? '—' : r.days_listed + 'd'],
      ['', money(r.rent)], ['step', '+' + money(fixed)],
      ['cost', money(r.fixed_cost)],
      [(r.in_target ? 'hit' : 'step') + ' soft',
       r.overlap ? '+' + money(r.overlap) + '/mo · ' + r.overlap_days + 'd' : '—'],
      ['total', money(r.cost_only)],
      ['step credit', r.applied ? '−' + money(r.applied) : '—'],
      ['eff', money(r.effective)],
    ];
    const off = Object.keys(r.credits).filter(k => !DATA.credits_enabled[k] && r.credits[k]);
    const line = (l, v2, cls) => '<div><span class="lbl">' + l + '</span><span' +
      (cls ? ' class="' + cls + '"' : '') + '>' + v2 + '</span></div>';
    /* Same two halves as the table: what they charge, then what you negotiate. */
    const bd = [
      ['break.rent', r.rent], ['break.fees', r.fees], ['break.parking', r.parking],
    ].map(([l, v2]) => line(t(l), money(v2))).join('')
    + line('<b>' + t('col.fixed_cost') + '</b>', '<b>' + money(r.fixed_cost) + '</b>')
    + line(t('break.overlap'), money(r.overlap))
    + line(t('break.overlap_once'),
           r.overlap_once ? money(r.overlap_once) + ' · ' + r.overlap_days + 'd' : '—')
    + line(t('break.overlap_flex', {n:DATA.search.flex_window_days}),
           money(r.overlap_flex) + ' · ' + r.overlap_flex_days + 'd', 'off')
    + line('<b>' + t('break.subtotal') + '</b>', '<b>' + money(r.cost_only) + '</b>')
    + Object.entries(r.credits).map(([k, v2]) => {
        const on = DATA.credits_enabled[k];
        return '<div><span class="lbl">' + t('break.' + k) +
          (on ? '' : ' <span class="off">' + t('break.credits_off') + '</span>') +
          '</span><span class="' + (on && v2 ? 'credit' : 'off') + '">' +
          (on && v2 ? '−' : '') + money(v2) + '</span></div>';
      }).join('')
    + (off.length ? '<div><span class="off">' + t('exposure.unverified') + '</span></div>' : '');
    return '<tr class="row ' + tier + '">' +
      cells.map(([cls, v2]) => '<td class="' + cls + '">' + v2 + '</td>').join('') +
      '</tr><tr class="detail" hidden><td colspan="' + COLS.length + '"><div class="bd">' +
      bd + '</div></td></tr>';
  }).join('');
  tbody.querySelectorAll('tr.row').forEach(tr => tr.addEventListener('click', () => {
    const d = tr.nextElementSibling; d.hidden = !d.hidden;
    tr.classList.toggle('open', !d.hidden);
  }));
  const more = document.getElementById('more');
  more.hidden = all.length <= DATA.page_size;
  more.textContent = shownAll ? t('more.less') : t('more.show', {n:all.length - lim});
}

/* ---- charts ---- */
function axisText(x, y, s, anchor){
  return '<text class="axis" x="' + x + '" y="' + y + '"' +
    (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' + esc(s) + '</text>';
}
function legend(el){
  el.innerHTML = PROPS.map(([sid, name]) =>
    '<span><i style="background:' + hue(sid) + '"></i>' + esc(name) + '</span>').join('');
}

function renderScatter(){
  const host = document.getElementById('scatter');
  const rs = DATA.ranked.filter(keep);
  const W = host.clientWidth || 440, H = 250, L = 52, R = 16, T = 10, B = 34;
  if (!rs.length){ host.innerHTML = '<div class="empty">' + t('meta.no_candidates') + '</div>'; return; }
  const xs = rs.map(r => r.sqft), ys = rs.map(r => value(r));
  const caps = Object.values(DATA.search.budget || {}).map(Number);
  const x0 = Math.min(...xs) * 0.95, x1 = Math.max(...xs) * 1.05;
  const y0 = Math.min(...ys) * 0.93, y1 = Math.max(Math.max(...ys), ...caps) * 1.04;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 4; i++){
    const v = y0 + (y1 - y0) * i / 4, y = Y(v);
    g += '<line class="grid" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) +
         '" y2="' + y.toFixed(1) + '"/>' + axisText(L - 7, y + 3.5, money(Math.round(v / 50) * 50), 'end');
  }
  for (let i = 0; i <= 3; i++){
    const v = x0 + (x1 - x0) * i / 3;
    g += axisText(X(v), H - 14, Math.round(v).toLocaleString('en-US'), 'middle');
  }
  const capLines = Object.entries(DATA.search.budget || {}).map(([b, c]) =>
    (c >= y0 && c <= y1)
      ? '<line x1="' + L + '" y1="' + Y(c) + '" x2="' + (W - R) + '" y2="' + Y(c) +
        '" stroke="var(--up)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>' +
        axisText(W - R - 2, Y(c) - 4, b + 'B ' + money(c), 'end') : '').join('');
  const dots = rs.map((r, i) =>
    '<circle data-i="' + i + '" cx="' + X(r.sqft).toFixed(1) + '" cy="' + Y(value(r)).toFixed(1) +
    '" r="5.5" fill="' + hue(r.source_id) + '" stroke="var(--panel)" stroke-width="2"/>').join('');
  host.innerHTML = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    g + capLines + dots +
    axisText(L, H - 2, t('chart.axis_sqft')) +
    '</svg>';
  host.querySelectorAll('circle').forEach(c => {
    const r = rs[+c.dataset.i];
    c.addEventListener('mousemove', e => showTip(e,
      '<b>' + esc(DATA.properties[r.source_id]) + ' ' + esc(r.unit) + '</b><br>' +
      r.beds + 'B · ' + r.sqft.toLocaleString('en-US') + ' sqft · ' + t('col.floor') + ' ' +
      (r.floor ?? '—') + '<br>' + t('col.rent') + ' ' + money(r.rent) + ' · ' +
      t('col.fixed_cost') + ' ' + money(r.fixed_cost)));
    c.addEventListener('mouseleave', hideTip);
  });
}

function renderTimeline(){
  const host = document.getElementById('timeline');
  const rs = rows().slice(0, 20);
  if (!rs.length){ host.innerHTML = '<div class="empty">' + t('meta.no_candidates') + '</div>'; return; }
  if (!DATA.search.current_lease_end || !DATA.summary.deadline){
    host.innerHTML = '<div class="empty">' + t('meta.no_candidates') + '</div>'; return; }
  const end = D(DATA.search.current_lease_end), dl = D(DATA.summary.deadline);
  const starts = rs.map(r => D(r.available).getTime());
  const t0 = Math.min(...starts, D(DATA.generated_at.slice(0, 10)).getTime());
  const t1 = end.getTime() + 3 * 864e5;
  const W = host.clientWidth || 440, rowH = 15, T = 8, B = 26, L = 62, R = 12;
  const H = T + rs.length * rowH + B;
  const X = ms => L + (ms - t0) / (t1 - t0) * (W - L - R);
  let g = '';
  const months = [];
  let d = new Date(t0); d.setDate(1);
  while (d.getTime() <= t1){ if (d.getTime() >= t0) months.push(new Date(d));
    d.setMonth(d.getMonth() + 1); }
  months.forEach(m => { const x = X(m.getTime());
    g += '<line class="grid" x1="' + x.toFixed(1) + '" y1="' + T + '" x2="' + x.toFixed(1) +
         '" y2="' + (H - B + 4) + '"/>' +
         axisText(x, H - B + 17, m.toLocaleDateString(loc(), {month:'short'}), 'middle'); });
  const bars = rs.map((r, i) => {
    const y = T + i * rowH + rowH / 2;
    const xs = X(D(r.lease_start).getTime()), xe = X(end.getTime());
    const wpx = Math.max(1.5, xe - xs);
    return axisText(L - 6, y + 3.5, r.unit, 'end') +
      '<rect data-i="' + i + '" x="' + xs.toFixed(1) + '" y="' + (y - 4) + '" width="' +
      wpx.toFixed(1) + '" height="8" rx="3" fill="' + hue(r.source_id) + '" opacity=".85"/>' +
      '<circle data-i="' + i + '" cx="' + X(D(r.available).getTime()).toFixed(1) + '" cy="' + y +
      '" r="3.5" fill="none" stroke="' + hue(r.source_id) + '" stroke-width="1.75"/>';
  }).join('');
  const dlx = X(dl.getTime());
  const bands = Object.entries(DATA.target_windows || {}).map(([sid, w]) => {
    const x1 = X(D(w.from).getTime()), x2 = X(D(w.to).getTime());
    return '<rect x="' + x1.toFixed(1) + '" y="' + T + '" width="' + (x2 - x1).toFixed(1) +
      '" height="' + (H - B + 4 - T) + '" fill="' + hue(sid) + '" opacity=".10"/>';
  }).join('');
  host.innerHTML = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    bands + g + bars +
    '<line x1="' + dlx.toFixed(1) + '" y1="' + T + '" x2="' + dlx.toFixed(1) + '" y2="' +
    (H - B + 4) + '" stroke="var(--up)" stroke-width="1.5" stroke-dasharray="4 3"/>' +
    axisText(dlx - 5, H - B + 17, t('chart.deadline', {date:day(DATA.summary.deadline)}), 'end') +
    '</svg>';
  host.querySelectorAll('[data-i]').forEach(el => {
    const r = rs[+el.dataset.i];
    el.addEventListener('mousemove', e => showTip(e,
      '<b>' + esc(DATA.properties[r.source_id]) + ' ' + esc(r.unit) + '</b><br>' +
      t('col.available') + ' ' + day(r.available) + '<br>' +
      t('col.lease_start') + ' ' + day(r.lease_start) + '<br>' +
      t('break.overlap') + ' ' + r.overlap_days + 'd · ' +
      (r.overlap_once ? money(r.overlap_once) : money(0)) + '<br>' +
      t('break.overlap_flex', {n:DATA.search.flex_window_days}) + ' ' +
      r.overlap_flex_days + 'd'));
    el.addEventListener('mouseleave', hideTip);
  });
}

/* ---- changes ---- */
const IMPORTANT = new Set(['critical', 'notable']);
function eventRows(){
  return DATA.events.filter(e =>
    (sevAll || IMPORTANT.has(e.severity)) &&
    (!F.eProp || e.source_id === F.eProp) && (!F.eKind || e.key === F.eKind));
}
function renderTarget(){
  const el = document.getElementById('target');
  if (!Object.keys(DATA.target_windows || {}).length){ el.hidden = true; return; }
  el.hidden = false;
  const rows = Object.entries(DATA.target_windows).map(([sid, w]) =>
    '<span class="r"><b style="color:' + hue(sid) + '">■</b> ' +
    t('target.range', {prop:esc(DATA.properties[sid] || sid), from:day(w.from),
                       to:day(w.to), n:w.window_days}) + '</span>').join('');
  el.innerHTML =
    '<span class="k">' + t('target.title') + '</span>' + rows +
    '<span class="why">' + t('target.explain') + '</span>';
}

function renderFeed(){
  const el = document.getElementById('feed'), all = eventRows();
  if (!all.length){
    el.innerHTML = '<div class="empty">' +
      t(sevAll ? 'meta.no_events' : 'sev.none_important') + '</div>';
    document.getElementById('moreE').hidden = true; return; }
  const lim = shownAllE ? all.length : Math.min(all.length, DATA.page_size);
  el.innerHTML = all.slice(0, lim).map(e => {
    const kind = e.severity;
    let extra = '';
    if (e.params && e.params.delta !== undefined)
      extra = t('unit.price_delta', {old:e.params.old, new:e.params.new,
        delta:(e.params.delta > 0 ? '+' : '') + e.params.delta});
    else if (e.params && e.params.shift_days !== undefined)
      extra = day(e.params.old) + ' → ' + day(e.params.new);
    if (e.params && e.params.away_days !== undefined)
      extra += ' · ' + t('notify.away_days', {n:e.params.away_days});
    const bits = [];
    if (e.beds !== null) bits.push(e.beds + 'B');
    if (e.sqft) bits.push(e.sqft + ' sqft');
    /* a price event already shows old -> new in `extra`; don't repeat it */
    if (e.rent && !(e.params && e.params.delta !== undefined)) bits.push(money(e.rent));
    if (e.key === 'event.delisted' && e.days_listed != null)
      bits.push(t('event.days_listed', {n:e.days_listed}));
    const size = bits.join(' · ');
    return '<div class="ev ' + kind + '"><span class="tag">' + t(e.key) + '</span>' +
      '<span>' + esc(DATA.properties[e.source_id] || '') + ' ' + esc(e.unit) + '</span>' +
      '<span class="meta">' + esc(size) + (extra ? ' · ' + esc(extra) : '') + '</span>' +
      '<time>' + stamp(e.ts) + '</time></div>';
  }).join('');
  const more = document.getElementById('moreE');
  more.hidden = all.length <= DATA.page_size;
  more.textContent = shownAllE ? t('more.less') : t('more.show', {n:all.length - lim});
}

/* ---- inventory ---- */
function sparkline(series){
  if (series.length < 2) return '';
  const w = 200, h = 40, pad = 3;
  const max = Math.max(...series), min = Math.min(...series), span = (max - min) || 1;
  const X = i => i / (series.length - 1) * (w - pad * 2) + pad;
  const Y = v => h - pad - (v - min) / span * (h - pad * 2);
  const pts = series.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1));
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
    '<path d="M' + X(0).toFixed(1) + ',' + h + ' L' + pts.join(' L') + ' L' +
    X(series.length - 1).toFixed(1) + ',' + h + ' Z" fill="var(--accent-soft)"/>' +
    '<polyline fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linejoin="round" ' +
    'points="' + pts.join(' ') + '"/><circle cx="' + X(series.length - 1).toFixed(1) + '" cy="' +
    Y(series[series.length - 1]).toFixed(1) + '" r="2.75" fill="var(--accent)"/></svg>';
}
function renderSpark(){
  document.getElementById('spark').innerHTML = PROPS.map(([sid, name]) => {
    const series = DATA.inventory.map(p => p.counts[sid] || 0);
    const last = series.length ? series[series.length - 1] : 0;
    return '<div class="s"><div class="p">' + esc(name) + '</div>' +
      '<div class="n serif">' + last + '</div>' +
      '<div class="p">' + t('meta.units_tracked', {n:last}) + '</div>' + sparkline(series) + '</div>';
  }).join('');
}

/* ---- paint ---- */
function paint(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  document.getElementById('updated').textContent = t('meta.updated', {ts: stamp(DATA.generated_at)});
  document.getElementById('lang').textContent = t('meta.lang');
  document.getElementById('limits').innerHTML =
    DATA.limitations.map(k => '<li>' + t(k) + '</li>').join('');
  document.getElementById('mCost').classList.toggle('on', mode === 'cost');
  document.getElementById('mEff').classList.toggle('on', mode !== 'cost');
  document.getElementById('sevImportant').classList.toggle('on', !sevAll);
  document.getElementById('sevAll').classList.toggle('on', sevAll);
  fillSelect(document.getElementById('fProp'), PROPS, t('filter.property') + ': ' + t('filter.all'));
  fillSelect(document.getElementById('eProp'), PROPS, t('filter.property') + ': ' + t('filter.all'));
  fillSelect(document.getElementById('fBeds'),
    [...new Set(DATA.ranked.map(r => r.beds))].sort().map(b => [String(b), b + 'B']),
    t('filter.beds') + ': ' + t('filter.all'));
  fillSelect(document.getElementById('eKind'),
    [...new Set(DATA.events.map(e => e.key))].map(k => [k, t(k)]),
    t('filter.event') + ': ' + t('filter.all'));
  document.getElementById('fProp').value = F.prop;
  document.getElementById('fBeds').value = F.beds;
  document.getElementById('eProp').value = F.eProp;
  document.getElementById('eKind').value = F.eKind;
  legend(document.getElementById('legS')); legend(document.getElementById('legT'));
  renderTiles(); renderTarget(); renderTable(); renderScatter(); renderTimeline();
  renderFeed(); renderSpark();
}

document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh'; store.set('rt-lang', lang); paint(); });
document.getElementById('mCost').addEventListener('click', () => {
  mode = 'cost'; sortKey = null; store.set('rt-mode', mode); paint(); });
document.getElementById('mEff').addEventListener('click', () => {
  mode = 'eff'; sortKey = null; store.set('rt-mode', mode); paint(); });
document.getElementById('fProp').addEventListener('change', e => {
  F.prop = e.target.value; renderTable(); renderScatter(); renderTimeline(); });
document.getElementById('fBeds').addEventListener('change', e => {
  F.beds = e.target.value; renderTable(); renderScatter(); renderTimeline(); });
document.getElementById('eProp').addEventListener('change', e => {
  F.eProp = e.target.value; shownAllE = false; renderFeed(); });
document.getElementById('eKind').addEventListener('change', e => {
  F.eKind = e.target.value; shownAllE = false; renderFeed(); });
document.getElementById('sevImportant').addEventListener('click', () => {
  sevAll = false; store.set('rt-sev', ''); shownAllE = false; paint(); });
document.getElementById('sevAll').addEventListener('click', () => {
  sevAll = true; store.set('rt-sev', 'all'); shownAllE = false; paint(); });
document.getElementById('more').addEventListener('click', () => { shownAll = !shownAll; renderTable(); });
document.getElementById('moreE').addEventListener('click', () => { shownAllE = !shownAllE; renderFeed(); });
addEventListener('resize', () => { renderScatter(); renderTimeline(); });
paint();
</script>
</body>
</html>
